name: Publicar version

# Se lanza al subir una etiqueta tipo v1.2.3 (npm run version:patch / minor / major)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            orden: --win
          - so: ubuntu-latest
            orden: --linux

    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir y subir a GitHub Releases
        run: npx electron-builder ${{ matrix.orden }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
