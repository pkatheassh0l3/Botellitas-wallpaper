name: Crear instalador

# Construye el instalador de Windows y lo deja para descargar en la pestaña
# Actions, sin publicar ninguna versión. Se lanza a mano (Actions → Crear
# instalador → Run workflow) y en cada cambio que llega a main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir instalador y portable
        run: npx electron-builder --win --publish never

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Estanteria-instalador-${{ github.sha }}
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
