name: Crear instalador

# Construye los instaladores de Windows y Linux y los deja para descargar en la
# pestaña Actions, sin publicar ninguna versión. Se lanza a mano (Actions →
# Crear instalador → Run workflow) y en cada cambio que llega a main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: windows
            orden: --win
            archivos: dist/*.exe
          - so: ubuntu-latest
            nombre: linux
            orden: --linux
            archivos: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        run: npx electron-builder ${{ matrix.orden }} --publish never

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Estanteria-${{ matrix.nombre }}-${{ github.sha }}
          path: ${{ matrix.archivos }}
          if-no-files-found: error
          retention-days: 30
